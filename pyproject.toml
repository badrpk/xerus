[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xerus-memory"
version = "0.1.0"
description = "Disk-first persistent memory runtime from Shmry Software Inc"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "Shmry Software Inc"}]

[project.scripts]
xerus = "xerus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["xerus*"]
